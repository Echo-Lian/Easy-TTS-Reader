<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self';
               script-src 'self';
               style-src 'self' 'unsafe-inline';
               media-src 'self' data: blob:;
               connect-src 'self';">
  <title>Easy TTS Reader</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app">
  <!-- ═══ Header ═══ -->
  <header id="header">
    <div class="header-left">
      <h1>🐚 Easy TTS Reader</h1>
      <span id="file-label" class="file-label"></span>
    </div>
    <div class="header-right">
      <button id="btn-settings" class="icon-btn" title="API Settings">⚙️</button>
    </div>
  </header>

  <!-- ═══ Main Content ═══ -->
  <main id="main">
    <!-- Drop Zone / File Picker -->
    <section id="drop-zone" class="drop-zone">
      <div class="drop-content">
        <div class="drop-icon">📄</div>
        <p class="drop-title">Drop a PDF here</p>
        <p class="drop-sub">or <a href="#" id="browse-link">browse files</a></p>
        <p class="drop-hint">Supports PDF, TXT, MD</p>
      </div>
      <div class="drop-overlay" id="drop-overlay">
        <span class="drop-overlay-text">Drop to open</span>
      </div>
    </section>

    <!-- Progress bar during loading -->
    <div id="loading-bar" class="loading-bar hidden">
      <div class="loading-bar-fill"></div>
      <span id="loading-text">Loading…</span>
    </div>

    <!-- Text Display -->
    <section id="text-section" class="text-section hidden">
      <div class="section-header">
        <h2 id="doc-title">Document</h2>
        <span id="doc-meta" class="doc-meta"></span>
      </div>
      <div id="text-display" class="text-display" contenteditable="true"></div>
    </section>

    <!-- Controls -->
    <section id="controls" class="controls hidden">
      <div class="controls-row">
        <button id="btn-play" class="btn btn-primary">▶ Play</button>
        <button id="btn-stop" class="btn btn-secondary" disabled>⏹ Stop</button>
        <button id="btn-export" class="btn btn-outline" disabled>💾 Export</button>
      </div>

      <div class="controls-row">
        <label class="control-group">
          <span class="control-label">Speed</span>
          <input type="range" id="speed-slider" min="0.5" max="2.0" step="0.1" value="1.0">
          <span id="speed-value" class="control-value">1.0×</span>
        </label>

        <label class="control-group">
          <span class="control-label">Voice</span>
          <select id="voice-select"></select>
        </label>
      </div>

      <!-- Progress -->
      <div id="progress" class="progress hidden">
        <div id="progress-bar" class="progress-bar">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <span id="progress-text" class="progress-text">0 / 0</span>
      </div>
    </section>

    <!-- Status bar -->
    <div id="status" class="status hidden">
      <span id="status-text"></span>
    </div>
  </main>

  <!-- ═══ Settings Modal ═══ -->
  <div id="settings-modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2>Settings</h2>
        <button id="modal-close" class="icon-btn">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="provider-select">TTS Provider</label>
          <select id="provider-select"></select>
          <p class="form-hint" id="provider-pricing"></p>
        </div>

        <div id="api-key-group" class="form-group hidden">
          <label for="api-key-input">OpenAI API Key</label>
          <div class="input-row">
            <input type="password" id="api-key-input" placeholder="sk-...">
            <button id="btn-validate-key" class="btn btn-small">Validate</button>
          </div>
          <p id="api-key-status" class="form-hint"></p>
          <p class="form-hint">
            Get your key at
            <a href="#" id="openai-link">platform.openai.com/api-keys</a>
          </p>
        </div>

        <div id="model-group" class="form-group hidden">
          <label for="model-select">TTS Model</label>
          <select id="model-select">
            <option value="tts-1">tts-1 (faster)</option>
            <option value="tts-1-hd">tts-1-hd (higher quality)</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button id="modal-done" class="btn btn-primary">Done</button>
      </div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
